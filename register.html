<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Registration – CodeMetrics</title>
  <meta name="description" content="Create a new student account to track your Java code metrics and submissions.">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Navigation Bar -->
  <nav class="navbar">
    <div class="nav-container">
      <a href="index.html" class="nav-brand">
        <div class="nav-logo-icon">CM</div>
        <span>CodeMetrics</span>
      </a>

      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="analyzer.html">Live Analyzer</a></li>
      </ul>

      <div class="nav-actions">
        <a href="login.html" class="btn btn-outline btn-sm">Sign In</a>
      </div>
    </div>
  </nav>

  <!-- Registration Card Form Wrapper -->
  <main class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <h2>Create Student Account</h2>
        <p>Register to submit code, view reports, and track your quality improvements</p>
      </div>

      <div id="register-error" class="alert alert-danger" style="display: none;"></div>

      <form id="register-form">
        <div class="form-group">
          <label class="form-label" for="reg-name">Full Student Name *</label>
          <input type="text" id="reg-name" class="form-control" placeholder="e.g. Rahul Sharma" required autocomplete="name">
        </div>

        <div class="form-group">
          <label class="form-label" for="reg-roll">Roll Number / Student ID</label>
          <input type="text" id="reg-roll" class="form-control" placeholder="e.g. 21CS042" value="21CS042">
        </div>

        <div class="form-group">
          <label class="form-label" for="reg-email">College Email Address *</label>
          <input type="email" id="reg-email" class="form-control" placeholder="e.g. rahul@college.edu" required autocomplete="email">
        </div>

        <div class="form-group">
          <label class="form-label" for="reg-password">Password (minimum 6 characters) *</label>
          <input type="password" id="reg-password" class="form-control" placeholder="Create a secure password" required autocomplete="new-password">
        </div>

        <div class="form-group">
          <label class="form-label" for="reg-confirm-password">Confirm Password *</label>
          <input type="password" id="reg-confirm-password" class="form-control" placeholder="Re-enter password" required autocomplete="new-password">
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 10px;" id="btn-submit-register">
          Complete Registration
        </button>
      </form>

      <div class="auth-footer">
        Already registered? <a href="login.html">Sign In here</a>
      </div>
    </div>
  </main>

  <footer class="footer" style="padding: 20px 0;">
    <div class="container" style="text-align: center; font-size: 0.85rem; color: #94a3b8;">
      &copy; 2026 CodeMetrics – Student Code Quality Analyzer | Academic CSE Semester Project
    </div>
  </footer>

  <script src="js/main.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
